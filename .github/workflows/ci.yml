name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build themes
        run: npm run build
      - name: Generated files must be committed (no drift)
        run: git diff --exit-code -- themes DECISIONS.md
      - run: npm test
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: benom-vsix
          path: "*.vsix"
